# The system primitives of DropWATCH, as used by the `visual-recap` skill to
# classify a change. `id` values are stable and quoted verbatim in recap
# blocks. `code` globs map changed paths to a primitive; first match wins.
# Build configuration leads so its broad build globs own every Dockerfile.
# Order the remaining primitives from specific to general, excluding overlaps.
#
# Keep this current: a PR that adds, removes, or reshapes a primitive updates
# this file in the same PR.

groups:
  surfaces: Entry points a human or a schedule can trigger.
  domain: Pure logic — no database, no clock, no network of its own.
  storage: Postgres and everything that owns a row or a job.
  platform: Cross-cutting services the surfaces build on.

primitives:
  - id: build-config
    group: platform
    summary: >
      Shared tsconfig, turbo pipeline, lint preset, Docker images, CI — and the
      distribution of those images: CI publishes them to GHCR on merge to main,
      and `deploy/` is the self-contained Compose artefact that consumes them.
    code:
      - packages/config/**
      - turbo.json
      - .github/workflows/**
      - .github/dependabot.yml
      - "**/Dockerfile"
      - .dockerignore
      - docker-compose*.yml
      - deploy/**
      - biome.json

  - id: web-dashboard
    group: surfaces
    summary: >
      Next.js App Router UI — product list, settings, invites, auth screens.
      Server Components call the API router in-process; client components go
      through the oRPC client.
    code:
      - apps/web/src/app/**
      - apps/web/src/components/**
      - apps/web/src/lib/**
      - apps/web/src/utils/**
      - apps/web/public/**
    depends_on: [api-router, auth, ui-kit, brand, env-config]

  - id: api-router
    group: surfaces
    summary: >
      oRPC procedures (products, settings, invites, preview) plus the context
      that carries the session. `protectedProcedure` is the only door to
      user-owned data.
    code:
      - packages/api/**
    depends_on: [app-db, job-queue, auth, extractor, email, alert-rules, brand]

  - id: worker-process
    group: surfaces
    summary: >
      Standalone Node process. Owns the pgboss schema, runs the minutely
      dispatcher cron, consumes check jobs, evaluates rules, sends alerts.
      Deliberately not booted from inside Next.js.
    code:
      - apps/worker/**
    depends_on:
      [job-queue, app-db, fetcher, extractor, alert-rules, notifier, email, renderer]

  - id: url-cli
    group: surfaces
    summary: One-off `test-url` command for checking extraction against a live URL.
    code:
      - packages/core/src/bin/**
    depends_on: [fetcher, extractor]

  - id: renderer
    group: surfaces
    summary: >
      Headless-Chromium sidecar (Playwright) that returns post-JavaScript HTML
      over HTTP. No database access, no queue, no cron.
    code:
      - apps/renderer/**
    depends_on: [outbound-network-guard]

  - id: fetcher
    group: domain
    summary: >
      Retrieval of a product page, plain HTTP or via the renderer sidecar for
      JS-composed pages — timeouts, headers, retry budget, per-domain queue.
    code:
      - packages/core/src/fetch/**
      - packages/core/src/render/**
    depends_on: [outbound-network-guard]

  - id: browser-identity
    group: domain
    summary: >
      What both transports claim to be — user agent, client-hint brands, locale
      and timezone. Shared so plain HTTP and the browser cannot present two
      different identities for one listing, and so the renderer stops
      announcing itself as headless, which CDNs refuse outright.
    code:
      - packages/core/src/net/identity.ts

  - id: outbound-network-guard
    group: domain
    summary: >
      Shared SSRF boundary for plain HTTP and browser retrieval. Restricts
      schemes and non-public addresses, validates and pins DNS answers at socket
      connection time (including browser egress through a guarded proxy), and
      supports an explicit private-host deployment allowlist.
    code:
      - packages/core/src/net/**

  - id: extractor
    group: domain
    summary: >
      Price and availability extraction, and recognising a page that holds no
      product to extract from — a bot-protection interstitial answers 200 and
      would otherwise read as a product page with no price. The automatic chain
      runs JSON-LD,
      microdata and OpenGraph in precedence order; a listing may instead be
      pinned to one expression strategy — a CSS selector (optionally reading an
      attribute with `::attr(name)`) or a JSONPath over the page's embedded JSON.
      It also derives those expressions rather than only running them: given a
      price a reader can see, it synthesises the candidates that read exactly
      that value from exactly one place, ranks them by how well they should
      survive a redesign, and reports what else the page quotes when the value
      is not on it. That is what the dashboard asks for now; writing an
      expression by hand is an escape hatch, not the path. This package
      owns the list of strategy names, which is why `listings.extractor` is a
      text column rather than a pg enum.
    code:
      - packages/core/src/extract/**
    depends_on: [money]

  - id: alert-rules
    group: domain
    summary: >
      Pure rule evaluation and alert dedupe — fires only on a new low or after
      the cooldown, keyed by (productId, rule). No database, no clock.
    code:
      - packages/core/src/rules/**
    depends_on: [money]

  - id: notifier
    group: domain
    summary: >
      Alert channels — Home Assistant webhook, ntfy, Discord, Telegram — and
      channel/target resolution. Never throws: a notification failure must not
      fail a check.
    code:
      - packages/core/src/notify/**
    depends_on: [brand]

  - id: money
    group: domain
    summary: Decimal money handling. Prices are never floats.
    code:
      - packages/core/src/decimal.ts

  - id: app-db
    group: storage
    summary: >
      Drizzle schema and the queries over it — products, listings,
      observations, settings, invites, recipients, alert state.
    code:
      - packages/db/src/schema/**
      - packages/db/src/*.ts
    excludes:
      - packages/db/src/queue.ts
      - packages/db/src/migrate.ts
      - packages/db/src/schema/auth.ts
    depends_on: [env-config]

  - id: job-queue
    group: storage
    summary: >
      pg-boss wiring — queue names, job payload types, and the two ways to get
      a boss. Postgres is the only interface between web and worker.
    code:
      - packages/db/src/queue.ts

  - id: migrations
    group: storage
    summary: >
      Generated SQL migrations and the runner. The parity integration test
      pins the schema to the migration history.
    code:
      - packages/db/src/migrations/**
      - packages/db/src/migrate.ts
      - packages/db/drizzle.config.ts

  - id: auth
    group: platform
    summary: >
      Better Auth server and client config, session handling, and the auth
      tables. Invite-gated signup lives here.
    code:
      - packages/auth/**
      - packages/db/src/schema/auth.ts
    depends_on: [app-db, email, env-config, brand]

  - id: email
    group: platform
    summary: >
      Resend client plus React Email templates — price alert, invite, verify,
      reset, change-email, watch-broken.
    code:
      - packages/email/**
    depends_on: [env-config, money, brand]

  - id: env-config
    group: platform
    summary: >
      Validated environment schemas per entry point (web, worker, db).
      SKIP_ENV_VALIDATION is the build-time escape hatch.
    code:
      - packages/env/**

  - id: ui-kit
    group: platform
    summary: shadcn/ui components and Tailwind theme shared by the dashboard.
    code:
      - packages/ui/**

  - id: brand
    group: platform
    summary: The product name and the logo artwork, plus the script that cleans and renders them.
    code:
      - packages/brand/**

  - id: e2e-harness
    group: platform
    summary: >
      Playwright suite, fixtures, and page objects. Runs against a dedicated
      build (NEXT_DIST_DIR=.next-e2e) and its own database.
    code:
      - apps/e2e/**
    depends_on: [brand]

invariants:
  - id: per-user-isolation
    statement: >
      Every product, listing, observation, setting, and recipient is scoped to
      a user. Uniqueness is per `(userId, url)` on listings; a product groups
      one user's listings of the same item. No query may read or write
      another user's rows.
    guarded_by: [api-router, app-db]

  - id: single-scheduler
    statement: >
      Only the worker migrates and supervises the pgboss schema and registers
      the cron. Every other process is a sender only — a second cron worker
      double-fires the dispatcher.
    guarded_by: [worker-process, job-queue]

  - id: notification-never-fails-a-check
    statement: >
      A failing webhook or email must not fail a check, lose a price point, or
      burn a pg-boss retry.
    guarded_by: [notifier, worker-process]

  - id: alert-dedupe
    statement: >
      A rule fires only when the condition holds AND (never alerted OR a new
      low OR past cooldown). Losing this makes the app cry wolf.
    guarded_by: [alert-rules]

  - id: invite-gated-signup
    statement: Signup requires a valid unused invite; there is no open registration.
    guarded_by: [auth, app-db]

  - id: migration-parity
    statement: >
      The Drizzle schema and the migration history must produce identical
      databases — enforced by the parity integration test.
    guarded_by: [migrations, app-db]
