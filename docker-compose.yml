# Local-development stack: Postgres in a container, alongside the same three
# app services production runs.
#
# For a real deployment, layer the production override on top — it points the
# apps at the Postgres instance already running on the host and switches this
# file's `postgres` service off:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# (or `pnpm docker:prod:up`, which is the same thing). See docs/installation.md.

name: drop-watch

# `apps/web/.env` is the file the rest of the repo already uses in development.
# The root `.env` is what a deployment writes, and comes second so it wins when
# both exist. Neither is required; anything missing falls back to the defaults
# below, or is simply unset (HA_URL / HA_WEBHOOK_ID are optional by design).
x-env-files: &env-files
  - path: apps/web/.env
    required: false
  - path: .env
    required: false

x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/drop-watch
  NODE_ENV: production
  # Every timestamp the worker schedules and the UI renders is derived from
  # this; leaving containers on UTC while the host is not is a quiet way to
  # make "last checked" wrong by an hour for half the year.
  TZ: ${TZ:-Europe/London}
  # Email is opt-in and RESEND_API_KEY is the switch; unset means webhook-only
  # alerting, which is a supported configuration. Both services need all
  # three: `web` sends Better Auth's verification and reset mail, `worker`
  # sends the alerts, and APP_URL is how the worker — which has no
  # BETTER_AUTH_URL of its own — knows what to link to.
  #
  # RENDER_URL is the browser-render switch, on the same footing: unset means
  # a browser-mode listing records a `renderer_error` check run rather than the
  # worker crashing (see the `renderer` service and packages/env/src/worker.ts).
  #
  # Listed with no value, so compose takes them from the shell or from the root
  # `.env`, and omits them entirely when neither has them. Note the precedence:
  # an `environment` key overrides `env_file` even when it resolves to nothing,
  # so for containers these belong in the root `.env` (which compose
  # interpolates) rather than only in `apps/web/.env` (which it does not).
  # ALLOWED_PRIVATE_HOSTS rides along for the same reason: the SSRF guard reads
  # it in whichever process is doing the fetching, and both of these do.
  ALLOWED_PRIVATE_HOSTS:
  APP_URL:
  EMAIL_FROM:
  RENDER_URL:
  RESEND_API_KEY:

services:
  # One-shot: applies migrations, then exits. `web` and `worker` are gated
  # behind it completing successfully, so a failed migration stops the whole
  # deployment rather than letting the apps boot against an old schema.
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    init: true
    env_file: *env-files
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # The one setting that cannot be changed by restarting the container.
      # `NEXT_PUBLIC_*` is inlined into the browser bundle by `next build`, and
      # the image is built without RESEND_API_KEY, so the flag next.config.ts
      # would otherwise derive is always `false` — leaving the email UI hidden
      # however this file's environment is filled in. Set it to `true` in the
      # root `.env` and rebuild (`pnpm docker:prod:up` builds) alongside the
      # key. It only controls what is offered; the routes and the mailer are
      # gated server-side on the key itself.
      args:
        NEXT_PUBLIC_EMAIL_ENABLED: ${NEXT_PUBLIC_EMAIL_ENABLED:-false}
    init: true
    ports:
      - "3001:3001"
    env_file: *env-files
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    env_file: *env-files
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The worker waits up to 30s for in-flight checks on SIGTERM; give it room
    # to finish rather than having Docker kill it mid-write.
    stop_grace_period: 40s
    restart: unless-stopped
    # No depends_on: renderer here — that would force the `browser` profile on
    # for everyone. The worker degrades gracefully when RENDER_URL is unset
    # (see apps/worker/src/check-listing.ts), which is exactly what makes this
    # dependency unnecessary.

  # Headless-Chromium sidecar for browser-mode listings. Opt-in: gated behind
  # the `browser` profile so `pnpm docker:up` never pulls a ~2GB image for
  # someone who will not use it. Enable with `COMPOSE_PROFILES=browser` in the
  # root `.env` (see .env.example). Reached only by `web` and `worker`, over
  # the compose network — no published ports.
  renderer:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    init: true
    # Chromium crashes on heavy pages with Docker's default 64MB /dev/shm, and
    # the usual workaround (--disable-dev-shm-usage) only trades crashes for
    # disk I/O. Give it real shared memory instead.
    shm_size: "1gb"
    environment:
      # The sidecar applies the same address guard the worker does, so it needs
      # the same exemptions — Chromium resolves names itself and would
      # otherwise be the one path around the policy.
      ALLOWED_PRIVATE_HOSTS:
      NODE_ENV: production
      TZ: ${TZ:-Europe/London}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Must stay under the worker's 40s: the renderer drains for 20s, the
    # worker waits 30s for in-flight checks, so the renderer must never die
    # first while the worker is still waiting on an answer from it.
    stop_grace_period: 30s
    restart: unless-stopped

  # Development only. The production override disables this service — see
  # docker-compose.prod.yml.
  postgres:
    image: postgres:18
    container_name: drop-watch-postgres
    environment:
      POSTGRES_DB: drop-watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - drop-watch_postgres_data:/var/lib/postgresql
    # -d names the target database, not just the server: on a fresh volume
    # `pg_isready` answers on the init-time socket before `POSTGRES_DB` has been
    # created, so checking the server alone reports ready too early and whatever
    # runs next (db:push) fails against a database that does not exist yet.
    # Paired with `--wait` in the db:start script, which is what actually blocks.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drop-watch"]
      start_period: 30s
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  drop-watch_postgres_data:
