# DropWatch, from prebuilt images — no clone, no build. Download this file
# (and, for browser mode, seccomp_profile.json — see the `renderer` service
# below) alongside an `.env` copied from `.env.example`, then:
#
#   docker compose up -d
#
# Every app service pulls its image from GitHub Container Registry instead of
# building from source; see the `image:` keys below for the two environment
# variables that control where from and which version.

name: drop-watch

# Only `.env` exists in a downloaded-file deployment — there is no
# `apps/web/.env` to layer underneath it, unlike the repo's own compose file.
x-env-files: &env-files
  - path: .env
    required: false

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/drop-watch}
  NODE_ENV: production
  # Every timestamp the worker schedules and the UI renders is derived from
  # this; leaving containers on UTC while the host is not is a quiet way to
  # make "last checked" wrong by an hour for half the year.
  TZ: ${TZ:-Europe/London}
  # Email is opt-in and RESEND_API_KEY is the switch; unset means webhook-only
  # alerting, which is a supported configuration. Both services need all
  # three: `web` sends Better Auth's verification and reset mail, `worker`
  # sends the alerts, and APP_URL is how the worker — which has no
  # BETTER_AUTH_URL of its own — knows what to link to.
  #
  # RENDER_URL is the browser-render switch, on the same footing: unset means
  # a browser-mode listing records a `renderer_error` check run rather than the
  # worker crashing (see the `renderer` service and packages/env/src/worker.ts).
  # `web` reads it too, but only to report whether a renderer is configured,
  # so the listing settings editor can enable or disable its browser toggle.
  #
  # Listed with no value, so compose takes them from the shell or from the
  # `.env` next to this file, and omits them entirely when neither has them.
  # Note the precedence: an `environment` key overrides `env_file` even when it
  # resolves to nothing, so for containers these belong in `.env` (which
  # compose interpolates). ALLOWED_PRIVATE_HOSTS rides along for the same
  # reason: the SSRF guard reads it in whichever process is doing the
  # fetching, and both of these do.
  ALLOWED_PRIVATE_HOSTS:
  APP_URL:
  EMAIL_FROM:
  RENDER_URL:
  RESEND_API_KEY:

services:
  # One-shot: applies migrations, then exits. `web` and `worker` are gated
  # behind it completing successfully, so a failed migration stops the whole
  # deployment rather than letting the apps boot against an old schema.
  #
  # No depends_on: postgres here, even under the `bundled-db` profile: Compose
  # auto-starts a profiled service that something `depends_on`, which would
  # make the profile inert. Safe to omit anyway, and already the production
  # pattern (docker-compose.prod.yml drops the same dependency) — the job
  # retries the connection itself, ~30 attempts at 2s intervals
  # (packages/db/src/migrate.ts), which is also what makes the stack come back
  # cleanly after a host reboot or against a Postgres that is still starting.
  migrate:
    image: ${DROP_WATCH_IMAGE:-ghcr.io/callumhughes/drop-watch}/migrate:${DROP_WATCH_VERSION:-latest}
    init: true
    env_file: *env-files
    environment: *app-environment
    # A no-op on Docker Desktop, which already resolves the name; required on
    # Linux, where host.docker.internal otherwise does not exist. Needed here
    # for the external-Postgres case (DATABASE_URL pointing at the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  web:
    image: ${DROP_WATCH_IMAGE:-ghcr.io/callumhughes/drop-watch}/web:${DROP_WATCH_VERSION:-latest}
    init: true
    ports:
      - "3001:3001"
    env_file: *env-files
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ${DROP_WATCH_IMAGE:-ghcr.io/callumhughes/drop-watch}/worker:${DROP_WATCH_VERSION:-latest}
    init: true
    env_file: *env-files
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The worker waits up to 30s for in-flight checks on SIGTERM; give it room
    # to finish rather than having Docker kill it mid-write.
    stop_grace_period: 40s
    restart: unless-stopped
    networks:
      - default
      - renderer-control
    # No depends_on: renderer here — that would force the `browser` profile on
    # for everyone. The worker degrades gracefully when RENDER_URL is unset
    # (see apps/worker/src/check-listing.ts), which is exactly what makes this
    # dependency unnecessary.

  # Headless-Chromium sidecar for browser-mode listings. Opt-in: gated behind
  # the `browser` profile so a default `docker compose up` never pulls a
  # ~2GB image for someone who will not use it. Enable with
  # `COMPOSE_PROFILES=bundled-db,browser` in `.env` (see .env.example).
  # Reached only by `web` and `worker`, over the compose network — no
  # published ports.
  renderer:
    profiles: ["browser"]
    image: ${DROP_WATCH_IMAGE:-ghcr.io/callumhughes/drop-watch}/renderer:${DROP_WATCH_VERSION:-latest}
    init: true
    # The browser receives hostile page content. These limits contain CPU,
    # memory, process and filesystem amplification even when Chromium itself
    # stops responding to Playwright's deadlines.
    cpus: ${RENDER_CPUS:-2.0}
    mem_limit: ${RENDER_MEMORY_LIMIT:-2g}
    pids_limit: ${RENDER_PIDS_LIMIT:-512}
    read_only: true
    tmpfs:
      - /tmp:size=${RENDER_TMPFS_LIMIT:-512m},mode=1777
    cap_drop:
      - ALL
    # Chromium's namespace sandbox chroots its zygote after isolating it. Keep
    # that one narrow capability; Chromium fails closed if it is removed.
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      # Playwright's Docker seccomp profile is the default Docker profile plus
      # the user-namespace syscalls Chromium needs for its own sandbox;
      # Chromium fails closed without them. Download seccomp_profile.json from
      # the repo (apps/renderer/seccomp_profile.json) and place it next to
      # this compose file before enabling the `browser` profile — it is not
      # baked into the image.
      - seccomp=./seccomp_profile.json
    # Chromium crashes on heavy pages with Docker's default 64MB /dev/shm, and
    # the usual workaround (--disable-dev-shm-usage) only trades crashes for
    # disk I/O. Give it real shared memory instead.
    shm_size: "1gb"
    environment:
      # The sidecar applies the same address guard the worker does, so it needs
      # the same exemptions — Chromium resolves names itself and would
      # otherwise be the one path around the policy.
      ALLOWED_PRIVATE_HOSTS:
      NODE_ENV: production
      TZ: ${TZ:-Europe/London}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Must stay under the worker's 40s: the renderer drains for 20s, the
    # worker waits 30s for in-flight checks, so the renderer must never die
    # first while the worker is still waiting on an answer from it.
    stop_grace_period: 30s
    restart: unless-stopped
    # Do not put a compromised browser on the application/database network.
    # The worker joins this network solely to call the renderer; the bridge
    # retains normal outbound internet access for guarded page requests.
    networks:
      - renderer-control

  # Bundled Postgres, opt-in via the `bundled-db` profile — the default in
  # .env.example, so the happy path is zero config. Drop `bundled-db` from
  # COMPOSE_PROFILES and set DATABASE_URL to point at Postgres you already
  # run elsewhere; nothing here depends on this service (see `migrate` above),
  # so leaving the profile off switches it off cleanly.
  postgres:
    image: postgres:18
    profiles: ["bundled-db"]
    container_name: drop-watch-postgres
    environment:
      POSTGRES_DB: drop-watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    # Loopback only. Nothing outside this stack needs the database — the apps
    # reach it over the compose network — so the published port exists purely
    # so you can reach it with psql from the host. Binding it to every
    # interface would put a Postgres whose password defaults to `password` on
    # the network the host sits on.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - drop-watch_postgres_data:/var/lib/postgresql
    # -d names the target database, not just the server: on a fresh volume
    # `pg_isready` answers on the init-time socket before `POSTGRES_DB` has been
    # created, so checking the server alone reports ready too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drop-watch"]
      start_period: 30s
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  drop-watch_postgres_data:

networks:
  renderer-control:
