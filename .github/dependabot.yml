version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/worker
      - /packages/db
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
    # Node majors move .nvmrc, engines and @types/node too, and no CI job builds
    # these images — so they land by hand, on the LTS schedule.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
