name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # turbo's default in CI is to group a task's output and print it once the
  # task exits, which holds the whole log back until the run is over.
  TURBO_LOG_ORDER: stream

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The renderer unit suite includes a real-browser SSRF/side-channel trap.
      - run: pnpm --filter @drop-watch/renderer exec playwright install --with-deps chromium
      # Ubuntu 24.04's AppArmor policy denies user namespaces to downloaded
      # Chromium builds. This ephemeral runner executes trusted fixture pages;
      # allow the Chromium sandbox itself instead of testing with --no-sandbox.
      - name: Allow Chromium user-namespace sandbox
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same as apps/web/Dockerfile: no runtime environment exists at build time.
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:password@localhost:5432/drop-watch-integration
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compose rather than a service container: the parity test runs pg_dump
      # via `docker compose exec postgres`, for a client matching the server.
      - run: pnpm db:start
      - run: pnpm test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DATABASE_URL: postgresql://postgres:password@localhost:5432/drop-watch-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres, the browser download and the build are independent, so the job
      # waits once for the slowest instead of three times in series. Logs go to
      # files and are replayed grouped, since concurrent stdout interleaves.
      #
      # The suite serves the build via `next start`, so anything the app reads
      # at build time has to be set here rather than at run time — mirroring
      # `appEnv` in apps/e2e/constants.ts. RESEND_API_KEY and the rest of the
      # runtime config are set by the suite at run time, not here. Invoked
      # directly rather than through turbo, which does not hash NEXT_DIST_DIR
      # and could hand back a `.next` build.
      - name: Start database, install browser and build
        env:
          NEXT_DIST_DIR: .next-e2e
          SKIP_ENV_VALIDATION: 1
        run: |
          pnpm db:start > "$RUNNER_TEMP/db.log" 2>&1 &
          db=$!
          pnpm --filter @drop-watch/e2e exec playwright install --with-deps chromium > "$RUNNER_TEMP/browser.log" 2>&1 &
          browser=$!
          pnpm --filter @drop-watch/web exec next build > "$RUNNER_TEMP/build.log" 2>&1 &
          build=$!

          status=0
          for task in db browser build; do
            if ! wait "${!task}"; then
              echo "::error::$task failed"
              status=1
            fi
            echo "::group::$task"
            cat "$RUNNER_TEMP/$task.log"
            echo "::endgroup::"
          done
          exit $status
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  # Both jobs below are conditional, and a job skipped by its own `if:` never
  # expands its matrix — GitHub then renders the name template verbatim, so a
  # `name:` containing ${{ matrix.* }} would show up in the checks list as raw
  # expression text. Neither sets one for that reason.
  images:
    # PR gate only: proves the four images still build. Nothing is pushed, so
    # no registry credentials are needed here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker, renderer, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Three of the four are apps/<name>/Dockerfile; the migration job is
          # built from the db package.
          file: ${{ matrix.image == 'migrate' && 'packages/db/Dockerfile' || format('apps/{0}/Dockerfile', matrix.image) }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

  publish:
    # Push-to-main only, and gated on every other job so a red commit — lint,
    # types, tests, the app build itself — never reaches GHCR.
    #
    # The registry scope is declared here rather than in the called workflow: a
    # called workflow cannot grant itself more than its caller holds.
    if: github.event_name == 'push'
    needs: [lint, types, test, build, integration, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
